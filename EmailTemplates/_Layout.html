<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{SchoolName}</title>
  <style>
    body { margin:0; padding:0; background:#f4f7fb; font-family:Segoe UI, Arial, sans-serif; color:#1f2937; }
    .wrap { max-width:600px; margin:0 auto; padding:24px 16px; }
    .card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,.08); }
    .header { background:linear-gradient(135deg,#1d4ed8,#2563eb); color:#fff; padding:28px 24px; text-align:center; }
    .logo { max-height:56px; margin-bottom:12px; }
    .header h1 { margin:0; font-size:22px; font-weight:700; }
    .header p { margin:8px 0 0; opacity:.92; font-size:14px; }
    .content { padding:28px 24px; line-height:1.6; font-size:15px; }
    .content h2 { margin:0 0 12px; font-size:20px; color:#111827; }
    .credentials { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:16px; margin:20px 0; }
    .credentials dt { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#64748b; margin-top:10px; }
    .credentials dt:first-child { margin-top:0; }
    .credentials dd { margin:4px 0 0; font-size:16px; font-weight:600; color:#0f172a; }
    .note { background:#fffbeb; border-left:4px solid #f59e0b; padding:12px 14px; margin:20px 0; font-size:14px; }
    .footer { padding:0 24px 28px; font-size:13px; color:#64748b; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        {LogoBlock}
        <h1>{SchoolName}</h1>
        <p>Student Learning Management System</p>
      </div>
      <div class="content">
        {{Body}}
      </div>
      <div class="footer">
        <p><strong>{SchoolName}</strong><br />Student Learning Management System</p>
      </div>
    </div>
  </div>
</body>
</html>
